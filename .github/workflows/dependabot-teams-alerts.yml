name: Dependabot alerts to Teams

# GitHub Actions has no trigger for Dependabot alerts, so poll the alerts API
# on a schedule and post only alerts that were not posted before.
on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "Post all currently open alerts (ignores the sent-alerts cache)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # save/restore the sent-alerts cache

concurrency:
  group: dependabot-teams-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Restore sent-alerts cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .dependabot-state
          key: dependabot-teams-seen-${{ github.run_id }}
          restore-keys: dependabot-teams-seen-

      - name: Post new alerts to Teams
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_READ_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          NOTIFY_EXISTING: ${{ inputs.notify_existing || 'false' }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-matched-key != '' }}
          MAX_POSTS: "25"
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ] || [ -z "${TEAMS_WEBHOOK_URL}" ]; then
            echo "::error::DEPENDABOT_READ_TOKEN or TEAMS_WEBHOOK_URL secret is missing"
            exit 1
          fi

          mkdir -p .dependabot-state
          seen=.dependabot-state/seen.txt
          touch "$seen"

          gh api --paginate "repos/${REPO}/dependabot/alerts?state=open&per_page=100" \
            --jq '.[]' | jq -s '.' > alerts.json
          total=$(jq 'length' alerts.json)
          echo "Open alerts: ${total}"

          # First run without a cache: remember existing alerts and post one summary,
          # so the channel is not flooded with old alerts.
          if [ "${CACHE_HIT}" != "true" ] && [ "${NOTIFY_EXISTING}" != "true" ]; then
            jq -r '.[].number' alerts.json > "$seen"
            summary=$(jq -n --arg repo "$REPO" --arg total "$total" '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard", version: "1.4",
                  body: [
                    {type: "TextBlock", size: "Medium", weight: "Bolder", text: "Dependabot alerts connected"},
                    {type: "TextBlock", wrap: true, text: ("Watching **" + $repo + "**. Open alerts right now: **" + $total + "**. New alerts will be posted here.")}
                  ],
                  actions: [{type: "Action.OpenUrl", title: "View alerts", url: ("https://github.com/" + $repo + "/security/dependabot")}]
                }
              }]
            }')
            curl -sS --fail-with-body -X POST -H "Content-Type: application/json" \
              -d "$summary" "$TEAMS_WEBHOOK_URL"
            echo "Seeded ${total} existing alerts"
            exit 0
          fi

          if [ "${NOTIFY_EXISTING}" = "true" ]; then
            : > "$seen"
          fi

          jq -r '.[].number' alerts.json | while read -r num; do
            grep -qx "$num" "$seen" || echo "$num"
          done > new.txt

          echo "New alerts: $(wc -l < new.txt)"
          posted=0
          while read -r num; do
            [ -z "$num" ] && continue
            if [ "$posted" -ge "$MAX_POSTS" ]; then
              echo "Hit MAX_POSTS=${MAX_POSTS}; the rest go out on the next run"
              break
            fi

            card=$(jq --argjson n "$num" --arg repo "$REPO" '
              .[] | select(.number == $n) |
              (.security_advisory.severity // "unknown") as $sev |
              {
                type: "message",
                attachments: [{
                  contentType: "application/vnd.microsoft.card.adaptive",
                  contentUrl: null,
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard", version: "1.4",
                    body: [
                      {type: "TextBlock", size: "Medium", weight: "Bolder", wrap: true,
                       color: (if ($sev == "critical" or $sev == "high") then "Attention" elif $sev == "medium" then "Warning" else "Default" end),
                       text: ("Dependabot alert #" + (.number|tostring) + ": " + ($sev|ascii_upcase))},
                      {type: "TextBlock", wrap: true, text: (.security_advisory.summary // "No summary")},
                      {type: "FactSet", facts: [
                        {title: "Repository", value: $repo},
                        {title: "Package", value: ((.dependency.package.name // "?") + " (" + (.dependency.package.ecosystem // "?") + ")")},
                        {title: "Manifest", value: (.dependency.manifest_path // "?")},
                        {title: "Vulnerable", value: (.security_vulnerability.vulnerable_version_range // "?")},
                        {title: "Fixed in", value: (.security_vulnerability.first_patched_version.identifier // "no fix yet")},
                        {title: "Advisory", value: (.security_advisory.ghsa_id // "?")},
                        {title: "CVE", value: (.security_advisory.cve_id // "none")}
                      ]}
                    ],
                    actions: [{type: "Action.OpenUrl", title: "Open alert", url: .html_url}]
                  }
                }]
              }' alerts.json)

            if curl -sS --fail-with-body -X POST -H "Content-Type: application/json" \
                 -d "$card" "$TEAMS_WEBHOOK_URL"; then
              echo "$num" >> "$seen"
              posted=$((posted + 1))
              echo "Posted alert #${num}"
            else
              echo "::warning::Failed to post alert #${num}; will retry next run"
            fi
            sleep 1
          done < new.txt

          echo "Posted ${posted} alert(s)"

      - name: Save sent-alerts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .dependabot-state
          key: dependabot-teams-seen-${{ github.run_id }}
